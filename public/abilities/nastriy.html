<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настрій - Cimeika</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background: radial-gradient(circle, #4facfe 0%, #00f2fe 100%);
        }
        
        .module-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .module-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .mood-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        @media (max-width: 640px) {
            .mood-selector {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .mood-button {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .mood-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .mood-icon {
            font-size: 64px;
            margin-bottom: 10px;
        }
        
        .mood-label {
            font-size: 16px;
            font-weight: 600;
        }
        
        .mood-history {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .mood-entry {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }
        
        .mood-entry-icon {
            font-size: 48px;
            flex-shrink: 0;
        }
        
        .mood-entry-content {
            flex: 1;
        }
        
        .mood-entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .mood-entry-label {
            font-family: var(--font-header);
            font-size: 18px;
        }
        
        .mood-entry-date {
            font-size: 12px;
            color: var(--text-dim);
        }
        
        .mood-entry-note {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dim);
            margin-bottom: 10px;
        }
        
        .mood-entry-meta {
            font-size: 11px;
            color: var(--text-dim);
        }
        
        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .section-title {
            font-family: var(--font-header);
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="module-container">
        <!-- Module Header -->
        <div class="module-header">
            <div class="module-title">
                <span>💧</span>
                <span>Настрій</span>
            </div>
            <div id="presence-dock"></div>
        </div>
        
        <!-- Controls -->
        <div class="module-controls">
            <a href="/" class="back-button">← Назад до головної</a>
        </div>
        
        <!-- Mood Selector -->
        <div class="section-title">Як ви себе почуваєте?</div>
        <div class="mood-selector">
            <div class="mood-button" data-icon="😊" data-label="Щасливий">
                <div class="mood-icon">😊</div>
                <div class="mood-label">Щасливий</div>
            </div>
            <div class="mood-button" data-icon="😌" data-label="Спокійний">
                <div class="mood-icon">😌</div>
                <div class="mood-label">Спокійний</div>
            </div>
            <div class="mood-button" data-icon="😔" data-label="Сумний">
                <div class="mood-icon">😔</div>
                <div class="mood-label">Сумний</div>
            </div>
            <div class="mood-button" data-icon="😤" data-label="Роздратований">
                <div class="mood-icon">😤</div>
                <div class="mood-label">Роздратований</div>
            </div>
            <div class="mood-button" data-icon="😰" data-label="Тривожний">
                <div class="mood-icon">😰</div>
                <div class="mood-label">Тривожний</div>
            </div>
            <div class="mood-button" data-icon="🤔" data-label="Задумливий">
                <div class="mood-icon">🤔</div>
                <div class="mood-label">Задумливий</div>
            </div>
        </div>
        
        <!-- History -->
        <div class="section-title" style="margin-top: 60px;">Історія настроїв</div>
        <div class="mood-history" id="moodHistory">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { CimeikaModule } from '/abilities/module-core.js';
        
        // Initialize module
        const nastriy = new CimeikaModule({
            id: 'nastriy',
            name: 'Настрій'
        });
        
        // Event handlers
        nastriy.onItemsChange = (items) => {
            renderHistory(items);
        };
        
        nastriy.onPresenceChange = (users) => {
            nastriy.renderPresence('presence-dock');
        };
        
        // Render history
        function renderHistory(items) {
            const history = document.getElementById('moodHistory');
            
            if (items.length === 0) {
                history.innerHTML = '<p style="text-align: center; color: var(--text-dim); padding: 40px;">Немає записів. Виберіть настрій вище!</p>';
                return;
            }
            
            // Sort by date (newest first)
            const sortedItems = [...items].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            history.innerHTML = sortedItems.map((item, index) => {
                const date = new Date(item.date);
                const formattedDate = date.toLocaleDateString('uk-UA', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                return `
                    <div class="mood-entry">
                        <div class="mood-entry-icon">${item.icon}</div>
                        <div class="mood-entry-content">
                            <div class="mood-entry-header">
                                <div class="mood-entry-label">${item.label}</div>
                                <div class="mood-entry-date">${formattedDate}</div>
                            </div>
                            ${item.note ? `<div class="mood-entry-note">${item.note}</div>` : ''}
                            <div class="mood-entry-meta">
                                Створено: ${item.by} на ${item.deviceId}
                            </div>
                            <button class="btn-delete" onclick="deleteEntry(${index})">Видалити</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Add mood
        document.querySelectorAll('.mood-button').forEach(button => {
            button.addEventListener('click', () => {
                const icon = button.dataset.icon;
                const label = button.dataset.label;
                
                const note = prompt('Додайте нотатку (необов\'язково):');
                
                nastriy.addItem({
                    icon,
                    label,
                    note: note || '',
                    date: new Date().toISOString()
                });
                
                // Visual feedback
                button.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    button.style.transform = '';
                }, 200);
            });
        });
        
        // Delete entry
        window.deleteEntry = (index) => {
            if (confirm('Видалити цей запис?')) {
                const items = nastriy.getItems();
                const sortedItems = [...items].sort((a, b) => new Date(b.date) - new Date(a.date));
                const actualIndex = items.indexOf(sortedItems[index]);
                
                nastriy.deleteItem(actualIndex);
            }
        };
        
        // Initial render
        renderHistory(nastriy.getItems());
        nastriy.renderPresence('presence-dock');
        
        // Migrate old data if exists
        nastriy.migrateFromLocalStorage('cimeika-nastriy');
    </script>
</body>
</html>
