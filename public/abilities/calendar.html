<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календар - Cimeika</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background: linear-gradient(to right, #fa709a 0%, #fee140 100%);
        }
        
        .module-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .module-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .timeline {
            position: relative;
            padding: 40px 0;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.2), 
                rgba(255, 255, 255, 0.5), 
                rgba(255, 255, 255, 0.2)
            );
            transform: translateX(-50%);
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 50px;
            display: flex;
            align-items: center;
        }
        
        .timeline-item:nth-child(odd) {
            flex-direction: row;
            justify-content: flex-start;
        }
        
        .timeline-item:nth-child(even) {
            flex-direction: row-reverse;
            justify-content: flex-start;
        }
        
        .timeline-dot {
            position: absolute;
            left: 50%;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            animation: dotPulse 2s ease-in-out infinite;
            z-index: 10;
        }
        
        @keyframes dotPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.3); }
        }
        
        .timeline-content {
            width: calc(50% - 40px);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 20px;
        }
        
        .timeline-item:nth-child(odd) .timeline-content {
            margin-right: auto;
        }
        
        .timeline-item:nth-child(even) .timeline-content {
            margin-left: auto;
        }
        
        .timeline-date {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timeline-source {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .source-podiya {
            background: rgba(255, 154, 158, 0.3);
        }
        
        .source-kazkar {
            background: rgba(44, 83, 100, 0.5);
        }
        
        .source-nastriy {
            background: rgba(79, 172, 254, 0.3);
        }
        
        .timeline-title {
            font-family: var(--font-header);
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .timeline-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dim);
        }
        
        .timeline-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .loading-message {
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
            color: var(--text-dim);
        }
        
        @media (max-width: 768px) {
            .timeline::before {
                left: 20px;
            }
            
            .timeline-dot {
                left: 20px;
            }
            
            .timeline-item {
                padding-left: 60px;
            }
            
            .timeline-item:nth-child(odd),
            .timeline-item:nth-child(even) {
                flex-direction: row;
                justify-content: flex-start;
            }
            
            .timeline-content {
                width: 100%;
                margin: 0 !important;
            }
        }
    </style>
</head>
<body>
    <div class="module-container">
        <!-- Module Header -->
        <div class="module-header">
            <div class="module-title">
                <span>📅</span>
                <span>Календар</span>
            </div>
            <div id="presence-dock"></div>
        </div>
        
        <!-- Controls -->
        <div class="module-controls">
            <a href="/" class="back-button">← Назад до головної</a>
        </div>
        
        <!-- Timeline -->
        <div class="timeline" id="timeline">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { CimeikaModule } from '/abilities/module-core.js';
        
        // Initialize modules for all sources
        const podiya = new CimeikaModule({ id: 'podiya', name: 'ПоДія' });
        const kazkar = new CimeikaModule({ id: 'kazkar', name: 'Казкар' });
        const nastriy = new CimeikaModule({ id: 'nastriy', name: 'Настрій' });
        
        // Track changes from any module
        let aggregatedItems = [];
        
        function updateTimeline() {
            aggregatedItems = [
                ...podiya.getItems().map(item => ({ ...item, source: 'podiya', icon: '⚡' })),
                ...kazkar.getItems().map(item => ({ ...item, source: 'kazkar', icon: '📖' })),
                ...nastriy.getItems().map(item => ({ ...item, source: 'nastriy', icon: item.icon }))
            ];
            
            renderTimeline(aggregatedItems);
        }
        
        // Listen to all modules
        podiya.onItemsChange = updateTimeline;
        kazkar.onItemsChange = updateTimeline;
        nastriy.onItemsChange = updateTimeline;
        
        // Render timeline
        function renderTimeline(items) {
            const timeline = document.getElementById('timeline');
            
            if (items.length === 0) {
                timeline.innerHTML = '<div class="loading-message">Немає подій в хронології.<br>Додайте події в ПоДія, історії в Казкар або настрої в Настрій.</div>';
                return;
            }
            
            // Sort by date (newest first)
            const sortedItems = [...items].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            timeline.innerHTML = sortedItems.map((item) => {
                const date = new Date(item.date);
                const formattedDate = date.toLocaleDateString('uk-UA', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                let title = '';
                let text = '';
                
                if (item.source === 'podiya') {
                    title = item.title;
                    text = item.description;
                } else if (item.source === 'kazkar') {
                    title = item.title;
                    text = item.text.substring(0, 150) + (item.text.length > 150 ? '...' : '');
                } else if (item.source === 'nastriy') {
                    title = item.label;
                    text = item.note;
                }
                
                return `
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <div class="timeline-date">
                                <span>${formattedDate}</span>
                                <span class="timeline-source source-${item.source}">${item.source.toUpperCase()}</span>
                            </div>
                            <div class="timeline-icon">${item.icon}</div>
                            <div class="timeline-title">${title}</div>
                            ${text ? `<div class="timeline-text">${text}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Initial render
        updateTimeline();
    </script>
</body>
</html>
