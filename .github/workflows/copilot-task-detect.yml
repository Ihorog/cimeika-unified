name: Copilot Task Detect

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  detect:
    if: contains(github.event.comment.body, '@copilot task:')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install PyYAML
      
      - name: Extract task description
        id: extract
        run: |
          # Extract task description from comment
          COMMENT_BODY="${{ github.event.comment.body }}"
          TASK_DESC=$(echo "$COMMENT_BODY" | grep -oP '@copilot task:\s*\K.*' | head -1)
          echo "task=$TASK_DESC" >> $GITHUB_OUTPUT
          
          # Generate task ID (8-char hash)
          TASK_ID=$(echo -n "$TASK_DESC$(date +%s)" | sha256sum | cut -c1-8)
          echo "id=$TASK_ID" >> $GITHUB_OUTPUT
          
          echo "Task: $TASK_DESC"
          echo "ID: $TASK_ID"
      
      - name: Generate manifest
        run: |
          python3 .copilot/generate.py \
            --task "${{ steps.extract.outputs.task }}" \
            --id "${{ steps.extract.outputs.id }}" \
            --output "manifests/auto-${{ steps.extract.outputs.id }}.yml"
      
      - name: Create feature branch
        run: |
          BRANCH_NAME="copilot/${{ steps.extract.outputs.id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add manifests/
          git commit -m "feat: Add Copilot task manifest ${{ steps.extract.outputs.id }}"
          git push origin "$BRANCH_NAME"
      
      - name: Create Pull Request
        id: create_pr
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const taskId = '${{ steps.extract.outputs.id }}';
            const manifestPath = `manifests/auto-${taskId}.yml`;
            const manifestContent = fs.readFileSync(manifestPath, 'utf8');
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Copilot] Task: ${{ steps.extract.outputs.task }}`,
              head: `copilot/${taskId}`,
              base: 'main',
              body: `## 🤖 Copilot Task Manifest
            
            **Requested by:** @${{ github.event.comment.user.login }}
            **Task:** ${{ steps.extract.outputs.task }}
            **Manifest:** \`${manifestPath}\`
            
            ### Manifest Preview
            
            \`\`\`yaml
            ${manifestContent}
            \`\`\`
            
            ### Next Steps
            
            1. Review the manifest above
            2. If approved, comment \`@copilot approve\` to execute
            3. Execution will be triggered automatically
            
            ---
            
            *Generated by Copilot Task Integration*`
            });
            
            return pr.number;
      
      - name: Reply to comment
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = ${{ steps.create_pr.outputs.result }};
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Task manifest generated!\n\n**Task ID:** \`${{ steps.extract.outputs.id }}\`\n**PR:** #${prNumber}\n\nReview the manifest in the PR and comment \`@copilot approve\` to execute.`
            });
