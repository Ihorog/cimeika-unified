name: reusable-ci

on:
  workflow_call:
    inputs:
      node:
        required: false
        type: boolean
        default: false
      python:
        required: false
        type: boolean
        default: false
      working-directory:
        required: false
        type: string
        default: "."
      python-version:
        required: false
        type: string
        default: "3.11"
      node-version:
        required: false
        type: string
        default: "20"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ inputs.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install Node deps
        if: ${{ inputs.node }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: ${{ inputs.node }}
        run: npm run lint --if-present

      - name: Build
        if: ${{ inputs.node }}
        run: npm run build --if-present

      - name: Test Node
        if: ${{ inputs.node }}
        run: npm test --if-present

      - name: Setup Python
        if: ${{ inputs.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Python deps
        if: ${{ inputs.python }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Test Python
        if: ${{ inputs.python }}
        run: pytest -q || true
