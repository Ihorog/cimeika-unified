version: "1.1"
system: "Cimeika / Ci+"
state: "multi_repo_topology_defined"
source: "local_repo_scan"
updated_at: "2026-09-01"

repos:
  cimeika-unified-main:
    layer: "core"
    role: "primary_product"
    status: "canonical"
    control_relation: "consumer_of_Ci-Contact-Kernel"
    canonical_paths:
      - "app"
      - "components"
      - "backend"
      - "android-webview"
      - "docs"
      - ".github/workflows"
      - "package.json"
      - "next.config.js"
      - "tsconfig.json"
      - "docker-compose.yml"
      - "Makefile"
    sidecar_paths:
      - "ci"
      - "memory"
      - "api"
      - "core"
      - "modules"
    freeze_candidates:
      - "frontend"
      - "web"
      - "ci/web"
      - "ci/ui"
      - "ci/cit-pwa"
      - "ci/ui_dashboard"
    archive_candidates:
      - "archive"
      - "cimeika-unified"

  Ci-Contact-Kernel-main:
    layer: "control"
    role: "canonical_execution_control_plane_and_evidence"
    visibility: "public"
    status: "canonical"
    authority:
      - "execution_coordination"
      - "policy_gate"
      - "evidence"
      - "responsibility_graph"
      - "protected_contours"

  ci_gitapi-main:
    layer: "infra"
    role: "supporting_infra_api_and_registry"
    visibility: "private"
    status: "canonical"
    canonical_paths:
      - "app"
      - "registry"
      - "content"
      - "packages/failover-core"
      - "config"
      - "scripts"
      - "tests"
      - "docs"
      - ".github/workflows"
    sidecar_paths:
      - "api"
      - "apps/gateway"
      - "ops"
      - "logs"

  cimeika-backend-main:
    layer: "edge"
    role: "workers_agents_runtime"
    status: "canonical"
    canonical_paths:
      - "src"
      - ".github/workflows"
      - "wrangler.jsonc"
      - "package.json"
      - "README.md"

  cit-main:
    layer: "sidecar"
    role: "local_termux_orchestrator"
    status: "restricted_sidecar"
    canonical_paths:
      - "server"
      - "core"
      - "registry"
      - "scripts/termux_boot"
      - "docs"
      - "AGENTS.md"

  ci-memory-main:
    layer: "sidecar"
    role: "memory_service"
    status: "pending_verify"

  media-main:
    layer: "assets"
    role: "asset_storage"
    status: "pending_verify"

global_rules:
  one_primary_product_repo: "cimeika-unified-main"
  one_execution_control_plane: "Ci-Contact-Kernel-main"
  supporting_infra_repo: "ci_gitapi-main"
  one_primary_edge_runtime: "cimeika-backend-main"
  cimeika_unified_is_control_consumer: true
  ci_gitapi_is_not_execution_authority: true
  cit_is_not_core: true
