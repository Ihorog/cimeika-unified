version: "1.1"
system: "Cimeika / Ci+"
updated_at: "2026-09-01"

unified_execution_process:
  intake_repo: cimeika-unified-main
  control_plane_repo: Ci-Contact-Kernel-main
  supporting_infra_repo: ci_gitapi-main
  edge_repo: cimeika-backend-main
  memory_repo: ci-memory-main
  assets_repo: media-main
  local_sidecar_repo: cit-main

  routing:
    product: cimeika-unified-main
    control: Ci-Contact-Kernel-main
    infra_support: ci_gitapi-main
    edge: cimeika-backend-main
    memory: ci-memory-main
    media: media-main
    local_sidecar: cit-main

  execution_chain:
    - classify_task
    - assign_owner_repo
    - compute_dependent_repos
    - execute_repo_local
    - run_repo_checks
    - sync_registry
    - run_cross_repo_checks
    - deploy_development
    - run_health_checks
    - approve_or_iterate

  hard_rules:
    - one_product_core
    - one_execution_control_plane
    - one_registry_truth
    - one_canonical_frontend
    - no_duplicate_runtime_roles
    - cimeika_unified_consumes_control_state
    - ci_gitapi_is_not_execution_authority
